name: Deva Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/deva-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: mobile
        run: flutter create . --platforms=android --project-name=deva --org=com.deva

      - name: Enforce secure Android settings
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android:allowBackup=' not in text:
              text = text.replace('<application', '<application\n        android:allowBackup="false"', 1)
          else:
              import re
              text = re.sub(r'android:allowBackup="[^"]*"', 'android:allowBackup="false"', text)
          manifest.write_text(text)
          PY

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyse
        working-directory: mobile
        run: flutter analyze

      - name: Run tests
        working-directory: mobile
        run: flutter test

      - name: Build debug APK
        working-directory: mobile
        run: >-
          flutter build apk --debug
          --dart-define=DEVA_API_URL=https://example.invalid
          --dart-define=DEVA_GOOGLE_SERVER_CLIENT_ID=placeholder.apps.googleusercontent.com

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deva-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
