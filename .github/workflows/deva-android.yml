name: Deva Android

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Live Deva backend URL, for example https://your-backend.onrender.com
        required: false
        type: string
      google_server_client_id:
        description: Google Web OAuth client ID used by the Deva backend
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/deva-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEVA_API_URL: ${{ inputs.api_url || vars.DEVA_API_URL }}
      DEVA_GOOGLE_SERVER_CLIENT_ID: ${{ inputs.google_server_client_id || vars.DEVA_GOOGLE_SERVER_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Deva debug signing key
        working-directory: mobile
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode android-signing/deva-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "Deva Android OAuth certificate fingerprints for package com.deva.deva:"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Validate live Deva configuration
        shell: bash
        run: |
          if [ -z "$DEVA_API_URL" ]; then
            echo "::error::Set repository variable DEVA_API_URL or provide api_url when running this workflow manually."
            exit 1
          fi
          if [ -z "$DEVA_GOOGLE_SERVER_CLIENT_ID" ]; then
            echo "::error::Set repository variable DEVA_GOOGLE_SERVER_CLIENT_ID or provide google_server_client_id when running this workflow manually."
            exit 1
          fi
          if [[ "$DEVA_API_URL" == *"example.invalid"* ]] || [[ "$DEVA_GOOGLE_SERVER_CLIENT_ID" == placeholder* ]]; then
            echo "::error::Placeholder Android configuration is not allowed."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: mobile
        shell: bash
        run: |
          flutter create . --platforms=android --project-name=deva --org=com.deva
          rm -f test/widget_test.dart

      - name: Enforce secure Android settings
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android:allowBackup=' not in text:
              text = text.replace('<application', '<application\n        android:allowBackup="false"', 1)
          else:
              import re
              text = re.sub(r'android:allowBackup="[^"]*"', 'android:allowBackup="false"', text)
          manifest.write_text(text)
          PY

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyse
        working-directory: mobile
        run: flutter analyze

      - name: Run tests
        working-directory: mobile
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests committed yet; skipping test step.'
          fi

      - name: Build debug APK
        working-directory: mobile
        run: >-
          flutter build apk --debug
          --dart-define=DEVA_API_URL="$DEVA_API_URL"
          --dart-define=DEVA_GOOGLE_SERVER_CLIENT_ID="$DEVA_GOOGLE_SERVER_CLIENT_ID"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deva-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
