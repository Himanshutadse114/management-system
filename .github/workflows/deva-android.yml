name: Deva Android

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Live Deva backend URL
        required: false
        default: https://management-system-pvmc.onrender.com
        type: string
      google_server_client_id:
        description: Google Web OAuth client ID used by Deva
        required: false
        default: 1001652255296-5b3dgdi1am0187r1k681kfjuv7hilei3.apps.googleusercontent.com
        type: string
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/deva-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEVA_API_URL: ${{ inputs.api_url || vars.DEVA_API_URL || 'https://management-system-pvmc.onrender.com' }}
      DEVA_GOOGLE_SERVER_CLIENT_ID: ${{ inputs.google_server_client_id || vars.DEVA_GOOGLE_SERVER_CLIENT_ID || '1001652255296-5b3dgdi1am0187r1k681kfjuv7hilei3.apps.googleusercontent.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Deva debug signing key
        working-directory: mobile
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode android-signing/deva-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "Deva Android OAuth certificate fingerprints for package com.deva.deva:"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Validate live Deva configuration
        shell: bash
        run: |
          if [ -z "$DEVA_API_URL" ]; then
            echo "::error::DEVA_API_URL is required."
            exit 1
          fi
          if [ -z "$DEVA_GOOGLE_SERVER_CLIENT_ID" ]; then
            echo "::error::DEVA_GOOGLE_SERVER_CLIENT_ID is required."
            exit 1
          fi
          if [[ "$DEVA_API_URL" == *"example.invalid"* ]] || [[ "$DEVA_GOOGLE_SERVER_CLIENT_ID" == placeholder* ]]; then
            echo "::error::Placeholder Android configuration is not allowed."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: mobile
        shell: bash
        run: |
          flutter create . --platforms=android --project-name=deva --org=com.deva
          rm -f test/widget_test.dart

      - name: Use legacy Google Play Services sign-in
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/main.dart')
          text = path.read_text()
          text = text.replace(
              "import 'package:flutter/material.dart';\n",
              "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\n",
              1,
          )
          text = text.replace(
              '  final GoogleSignIn _google = GoogleSignIn.instance;',
              '  late final GoogleSignIn _google;',
          )
          text = text.replace(
              "    if (_googleServerClientId.isNotEmpty) {\n      await _google.initialize(serverClientId: _googleServerClientId);\n    } else {\n      await _google.initialize();\n    }",
              "    _google = GoogleSignIn(\n      serverClientId: _googleServerClientId.isEmpty ? null : _googleServerClientId,\n    );",
          )
          text = text.replace(
              "      final account = await _google.authenticate();\n      final credential = account.authentication.idToken;",
              "      final account = await _google.signIn();\n      if (account == null) {\n        throw PlatformException(code: 'sign_in_cancelled', message: 'Google Sign-In was cancelled.');\n      }\n      final authentication = await account.authentication;\n      final credential = authentication.idToken;",
          )
          text = text.replace(
              "    if (exception is GoogleSignInException) {\n      return exception.description ?? 'Google Sign-In failed. Please try again.';\n    }",
              "    if (exception is PlatformException) {\n      final detail = '${exception.code} ${exception.message ?? ''} ${exception.details ?? ''}';\n      if (detail.contains('10')) {\n        return 'Google Android OAuth is not registered for this Deva APK. Add package com.deva.deva with the Deva SHA-1 in Google Cloud, then try again.';\n      }\n      return exception.message ?? 'Google Sign-In failed. Please try again.';\n    }",
          )
          required = [
              'late final GoogleSignIn _google;',
              'final account = await _google.signIn();',
              'Google Android OAuth is not registered for this Deva APK.'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Legacy Google Sign-In patch failed: {missing}')
          path.write_text(text)
          PY

      - name: Enforce secure Android settings
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android:allowBackup=' not in text:
              text = text.replace('<application', '<application\n        android:allowBackup="false"', 1)
          else:
              import re
              text = re.sub(r'android:allowBackup="[^"]*"', 'android:allowBackup="false"', text)
          manifest.write_text(text)
          PY

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyse
        working-directory: mobile
        run: flutter analyze

      - name: Run tests
        working-directory: mobile
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests committed yet; skipping test step.'
          fi

      - name: Build debug APK
        working-directory: mobile
        run: >-
          flutter build apk --debug
          --dart-define=DEVA_API_URL="$DEVA_API_URL"
          --dart-define=DEVA_GOOGLE_SERVER_CLIENT_ID="$DEVA_GOOGLE_SERVER_CLIENT_ID"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deva-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
