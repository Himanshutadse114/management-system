name: Deva Android

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Live Deva backend URL
        required: false
        default: https://management-system-pvmc.onrender.com
        type: string
      google_server_client_id:
        description: Google Web OAuth client ID used by Deva
        required: false
        default: 1001652255296-5b3dgdi1am0187r1k681kfjuv7hilei3.apps.googleusercontent.com
        type: string
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/deva-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEVA_API_URL: ${{ inputs.api_url || vars.DEVA_API_URL || 'https://management-system-pvmc.onrender.com' }}
      DEVA_GOOGLE_SERVER_CLIENT_ID: ${{ inputs.google_server_client_id || vars.DEVA_GOOGLE_SERVER_CLIENT_ID || '1001652255296-5b3dgdi1am0187r1k681kfjuv7hilei3.apps.googleusercontent.com' }}
      DEVA_ANDROID_SHA1: 'F1:4D:5A:DD:99:AA:BC:1B:33:62:34:CD:99:4A:32:48:F4:59:E4:21'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Deva Android signing key
        working-directory: mobile
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode android-signing/deva-debug.keystore.b64 > "$HOME/.android/deva-debug.keystore"
          chmod 600 "$HOME/.android/deva-debug.keystore"
          keytool -list -v -keystore "$HOME/.android/deva-debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Validate live Deva configuration
        shell: bash
        run: |
          test -n "$DEVA_API_URL" || { echo "::error::DEVA_API_URL is required."; exit 1; }
          test -n "$DEVA_GOOGLE_SERVER_CLIENT_ID" || { echo "::error::DEVA_GOOGLE_SERVER_CLIENT_ID is required."; exit 1; }
          if [[ "$DEVA_API_URL" == *"example.invalid"* ]] || [[ "$DEVA_GOOGLE_SERVER_CLIENT_ID" == placeholder* ]]; then
            echo "::error::Placeholder Android configuration is not allowed."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: mobile
        shell: bash
        run: |
          flutter create . --platforms=android --project-name=deva --org=com.deva
          rm -f test/widget_test.dart
          grep -F 'applicationId = "com.deva.deva"' android/app/build.gradle.kts

      - name: Force exact Deva APK signing certificate
        working-directory: mobile
        shell: bash
        run: |
          cp "$HOME/.android/deva-debug.keystore" android/app/deva-debug.keystore
          python3 -c 'from pathlib import Path; p=Path("android/app/build.gradle.kts"); t=p.read_text(); m="    buildTypes {\n"; s="    signingConfigs {\n        getByName(\"debug\") {\n            storeFile = file(\"deva-debug.keystore\")\n            storePassword = \"android\"\n            keyAlias = \"androiddebugkey\"\n            keyPassword = \"android\"\n        }\n    }\n\n"; assert m in t; p.write_text(t.replace(m,s+m,1))'

      - name: Use legacy Google Play Services sign-in
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/main.dart')
          text = path.read_text()
          text = text.replace("import 'package:flutter/material.dart';\n", "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\n", 1)
          text = text.replace('  final GoogleSignIn _google = GoogleSignIn.instance;', '  late final GoogleSignIn _google;')
          text = text.replace("    if (_googleServerClientId.isNotEmpty) {\n      await _google.initialize(serverClientId: _googleServerClientId);\n    } else {\n      await _google.initialize();\n    }", "    _google = GoogleSignIn(\n      serverClientId: _googleServerClientId.isEmpty ? null : _googleServerClientId,\n    );")
          text = text.replace("      final account = await _google.authenticate();\n      final credential = account.authentication.idToken;", "      final account = await _google.signIn();\n      if (account == null) {\n        throw PlatformException(code: 'sign_in_cancelled', message: 'Google Sign-In was cancelled.');\n      }\n      final authentication = await account.authentication;\n      final credential = authentication.idToken;")
          text = text.replace("    if (exception is GoogleSignInException) {\n      return exception.description ?? 'Google Sign-In failed. Please try again.';\n    }", "    if (exception is PlatformException) {\n      final detail = '${exception.code} ${exception.message ?? ''} ${exception.details ?? ''}';\n      if (detail.contains('10')) {\n        return 'Google rejected this Android app identity. Verify the package and signing SHA-1 registered for Deva Android.';\n      }\n      return exception.message ?? 'Google Sign-In failed. Please try again.';\n    }")
          required = ['late final GoogleSignIn _google;', 'final account = await _google.signIn();', 'Google rejected this Android app identity.']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Legacy Google Sign-In patch failed: {missing}')
          path.write_text(text)
          PY

      - name: Enforce secure Android settings
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android:allowBackup=' not in text:
              text = text.replace('<application', '<application\n        android:allowBackup="false"', 1)
          else:
              text = re.sub(r'android:allowBackup="[^"]*"', 'android:allowBackup="false"', text)
          manifest.write_text(text)
          PY

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyse
        working-directory: mobile
        run: flutter analyze

      - name: Run tests
        working-directory: mobile
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests committed yet; skipping test step.'
          fi

      - name: Build debug APK
        working-directory: mobile
        run: >-
          flutter build apk --debug
          --dart-define=DEVA_API_URL="$DEVA_API_URL"
          --dart-define=DEVA_GOOGLE_SERVER_CLIENT_ID="$DEVA_GOOGLE_SERVER_CLIENT_ID"

      - name: Verify finished APK signing SHA-1
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, struct
          apk = Path('build/app/outputs/flutter-apk/app-debug.apk').read_bytes()
          eocd = apk.rfind(b'PK\x05\x06')
          if eocd < 0:
              raise SystemExit('APK EOCD not found.')
          central_offset = struct.unpack_from('<I', apk, eocd + 16)[0]
          magic_offset = central_offset - 16
          if apk[magic_offset:central_offset] != b'APK Sig Block 42':
              raise SystemExit('APK signing block not found.')
          block_size = struct.unpack_from('<Q', apk, magic_offset - 8)[0]
          block_start = central_offset - block_size - 8
          pos = block_start + 8
          end = magic_offset - 8
          v2 = None
          while pos < end:
              length = struct.unpack_from('<Q', apk, pos)[0]
              pos += 8
              pair_id = struct.unpack_from('<I', apk, pos)[0]
              value = apk[pos + 4:pos + length]
              if pair_id == 0x7109871A:
                  v2 = value
                  break
              pos += length
          if v2 is None:
              raise SystemExit('APK v2 signature not found.')
          def lp(buf, offset=0):
              length = struct.unpack_from('<I', buf, offset)[0]
              return buf[offset + 4:offset + 4 + length], offset + 4 + length
          signers, _ = lp(v2)
          signer, _ = lp(signers)
          signed_data, _ = lp(signer)
          _, q = lp(signed_data)
          certificates, _ = lp(signed_data, q)
          cert, _ = lp(certificates)
          fingerprint = ':'.join(hashlib.sha1(cert).hexdigest()[i:i+2] for i in range(0, 40, 2)).upper()
          expected = os.environ['DEVA_ANDROID_SHA1'].upper()
          print(f'Finished APK SHA-1: {fingerprint}')
          print(f'Google Cloud SHA-1: {expected}')
          if fingerprint != expected:
              raise SystemExit(f'APK signing SHA-1 mismatch: {fingerprint} != {expected}')
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deva-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
