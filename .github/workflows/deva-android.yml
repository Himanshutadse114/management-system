name: Deva Android

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: Live Deva web-platform URL
        required: false
        default: https://management-system-1-4y2u.onrender.com
        type: string
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/deva-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEVA_WEB_URL: ${{ inputs.web_url || vars.DEVA_WEB_URL || 'https://management-system-1-4y2u.onrender.com' }}
      DEVA_ANDROID_SHA1: 'F1:4D:5A:DD:99:AA:BC:1B:33:62:34:CD:99:4A:32:48:F4:59:E4:21'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare Deva Android signing key
        working-directory: mobile
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode android-signing/deva-debug.keystore.b64 > "$HOME/.android/deva-debug.keystore"
          chmod 600 "$HOME/.android/deva-debug.keystore"
          keytool -list -v -keystore "$HOME/.android/deva-debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Validate live Deva configuration
        shell: bash
        run: |
          test -n "$DEVA_WEB_URL" || { echo "::error::DEVA_WEB_URL is required."; exit 1; }
          if [[ "$DEVA_WEB_URL" == *"example.invalid"* ]]; then
            echo "::error::Placeholder Android configuration is not allowed."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate committed Android project
        working-directory: mobile
        shell: bash
        run: |
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          grep -F 'applicationId = "com.deva.deva"' android/app/build.gradle.kts

      - name: Configure exact Deva APK signing certificate
        working-directory: mobile
        shell: bash
        run: |
          cp "$HOME/.android/deva-debug.keystore" android/app/deva-debug.keystore
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          text = p.read_text()
          marker = "    buildTypes {\n"
          signing = """    signingConfigs {
                  getByName("debug") {
                      storeFile = file("deva-debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
                  create("devaRelease") {
                      storeFile = file("deva-debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

          """
          assert marker in text
          text = text.replace(marker, signing + marker, 1)
          text = text.replace("signingConfig = null", "signingConfig = signingConfigs.getByName(\"devaRelease\")", 1)
          p.write_text(text)
          PY

      - name: Enforce secure Android settings
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android:allowBackup=' not in text:
              text = text.replace('<application', '<application\n        android:allowBackup="false"', 1)
          else:
              text = re.sub(r'android:allowBackup="[^"]*"', 'android:allowBackup="false"', text)
          manifest.write_text(text)
          PY

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyse
        working-directory: mobile
        run: flutter analyze

      - name: Run tests
        working-directory: mobile
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests committed yet; skipping test step.'
          fi

      - name: Build release APK
        working-directory: mobile
        run: >-
          flutter build apk --release --build-number=6
          --dart-define=DEVA_WEB_URL="$DEVA_WEB_URL"

      - name: Verify finished APK signing SHA-1
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, struct
          apk = Path('build/app/outputs/flutter-apk/app-release.apk').read_bytes()
          eocd = apk.rfind(b'PK\x05\x06')
          if eocd < 0:
              raise SystemExit('APK EOCD not found.')
          central_offset = struct.unpack_from('<I', apk, eocd + 16)[0]
          magic_offset = central_offset - 16
          if apk[magic_offset:central_offset] != b'APK Sig Block 42':
              raise SystemExit('APK signing block not found.')
          block_size = struct.unpack_from('<Q', apk, magic_offset - 8)[0]
          block_start = central_offset - block_size - 8
          pos = block_start + 8
          end = magic_offset - 8
          v2 = None
          while pos < end:
              length = struct.unpack_from('<Q', apk, pos)[0]
              pos += 8
              pair_id = struct.unpack_from('<I', apk, pos)[0]
              value = apk[pos + 4:pos + length]
              if pair_id == 0x7109871A:
                  v2 = value
                  break
              pos += length
          if v2 is None:
              raise SystemExit('APK v2 signature not found.')
          def lp(buf, offset=0):
              length = struct.unpack_from('<I', buf, offset)[0]
              return buf[offset + 4:offset + 4 + length], offset + 4 + length
          signers, _ = lp(v2)
          signer, _ = lp(signers)
          signed_data, _ = lp(signer)
          _, q = lp(signed_data)
          certificates, _ = lp(signed_data, q)
          cert, _ = lp(certificates)
          fingerprint = ':'.join(hashlib.sha1(cert).hexdigest()[i:i+2] for i in range(0, 40, 2)).upper()
          expected = os.environ['DEVA_ANDROID_SHA1'].upper()
          print(f'Finished APK SHA-1: {fingerprint}')
          print(f'Expected Deva SHA-1: {expected}')
          if fingerprint != expected:
              raise SystemExit(f'APK signing SHA-1 mismatch: {fingerprint} != {expected}')
          PY

      - name: Upload Deva release APK
        uses: actions/upload-artifact@v4
        with:
          name: deva-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
