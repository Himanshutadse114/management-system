name: Management System CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: management_system_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d management_system_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      DB_DIALECT: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: management_system_test
      DB_USER: postgres
      DB_PASS: postgres
      DB_SSL: false
      JWT_SECRET: test-only-jwt-secret-with-more-than-32-characters
      SUPER_ADMIN_EMAIL: superadmin@example.com
      GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Check backend JavaScript syntax
        run: find src tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run critical flow tests
        run: npm test
