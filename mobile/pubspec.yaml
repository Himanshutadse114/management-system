name: deva
description: Deva mobile app for shared outlet operations.
publish_to: "none"
version: 0.1.0+3

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  flutter_secure_storage: 9.2.4
  # Keep Android on the pre-Credential-Manager sign-in path for now. The 7.x
  # Android implementation can surface Google Credential Manager's ambiguous
  # "[16] Account reauth failed" error on some devices/configurations.
  google_sign_in: 6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
